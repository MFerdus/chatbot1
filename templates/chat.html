<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medical Knowledge Assistant</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="container-fluid h-100"><div class="row justify-content-center h-100"><div class="col-md-8 col-xl-6 chat"><div class="card">
<div class="card-header msg_head"><div class="user_info"><span>Medical Knowledge Assistant</span><p>Educational information only — not medical advice.</p></div></div>
<div id="messages" class="card-body msg_card_body" aria-live="polite"></div>
<div class="card-footer"><form id="message-form" class="input-group"><input id="text" name="msg" class="form-control type_msg" maxlength="4000" placeholder="Ask about the indexed medical reference..." autocomplete="off" required><div class="input-group-append"><button id="send" type="submit" class="input-group-text send_btn" aria-label="Send"><i class="fas fa-location-arrow"></i></button></div></form></div>
</div></div></div></main>
<script>
const form=document.getElementById("message-form"),input=document.getElementById("text"),messages=document.getElementById("messages"),send=document.getElementById("send");
function addMessage(text,sender){const row=document.createElement("div");row.className=`d-flex ${sender==="user"?"justify-content-end":"justify-content-start"} mb-4`;const bubble=document.createElement("div");bubble.className=sender==="user"?"msg_cotainer_send":"msg_cotainer";bubble.textContent=text;row.appendChild(bubble);messages.appendChild(row);messages.scrollTop=messages.scrollHeight;}
form.addEventListener("submit",async event=>{event.preventDefault();const question=input.value.trim();if(!question)return;addMessage(question,"user");input.value="";send.disabled=true;try{const response=await fetch("/get",{method:"POST",body:new URLSearchParams({msg:question})});const data=await response.json();addMessage(data.answer||data.error||"No response was returned.","bot");}catch(error){addMessage("Could not reach the server. Please try again.","bot");}finally{send.disabled=false;input.focus();}});
</script></body></html>
